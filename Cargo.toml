[workspace]
resolver = "3"
members = ["crates/saturnus", "crates/saturnus-cli", "crates/saturnus-web", "crates/saturnus-drive", "crates/saturnus-objects", "crates/saturnus-mcp", "crates/saturnus-refgen", "crates/saturnus-tauri"]
# The Tauri app needs the system webview's libraries (webkit2gtk on Linux),
# so plain `cargo build`/`test` leave it out; CI builds it in its own job
# (kb/docs/ci.md). `--workspace` includes it: pass `--exclude saturnus-tauri`.
default-members = ["crates/saturnus", "crates/saturnus-cli", "crates/saturnus-web", "crates/saturnus-drive", "crates/saturnus-objects", "crates/saturnus-mcp", "crates/saturnus-refgen"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ractive/saturnus"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
