[workspace]
resolver = "3"
members = ["crates/saturnus-core", "crates/saturnus-cli", "crates/saturnus-web", "crates/saturnus-drive", "crates/saturnus-objects", "crates/saturnus-host", "crates/saturnus-kermit", "crates/saturnus-refgen", "crates/saturnus-tauri", "crates/saturnus-tx-tauri", "crates/satx-core", "crates/satx-cli", "crates/saturnus-tx", "crates/kermit-proto", "crates/xmodem-proto"]
# The Tauri apps (saturnus-tauri, saturnus-tx-tauri) need the system
# webview's libraries (webkit2gtk on Linux), so plain `cargo build`/`test`
# leave them out; CI builds them in its own job (kb/docs/ci.md).
# `--workspace` includes them: pass `--exclude saturnus-tauri --exclude
# saturnus-tx-tauri`.
default-members = ["crates/saturnus-core", "crates/saturnus-cli", "crates/saturnus-web", "crates/saturnus-drive", "crates/saturnus-objects", "crates/saturnus-host", "crates/saturnus-kermit", "crates/saturnus-refgen", "crates/satx-core", "crates/satx-cli", "crates/saturnus-tx", "crates/kermit-proto", "crates/xmodem-proto"]

[workspace.package]
# One version for every crate and the desktop app; the release tag is
# `v` + this (kb/docs/releasing.md).
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ractive/saturnus"
homepage = "https://ractive.ch/saturnus/"
rust-version = "1.88"

# The workspace's own crates: a path for building here, a version for the
# published packages (crates.io needs one on every dependency).
[workspace.dependencies]
saturnus-core = { path = "crates/saturnus-core", version = "0.5.0" }
saturnus-objects = { path = "crates/saturnus-objects", version = "0.5.0" }
saturnus-host = { path = "crates/saturnus-host", version = "0.5.0" }
saturnus-drive = { path = "crates/saturnus-drive", version = "0.5.0" }
saturnus-web = { path = "crates/saturnus-web", version = "0.5.0" }
saturnus-kermit = { path = "crates/saturnus-kermit" }
kermit-proto = { path = "crates/kermit-proto", version = "0.5.0" }
xmodem-proto = { path = "crates/xmodem-proto", version = "0.5.0" }
satx-core = { path = "crates/satx-core", version = "0.5.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# The in-process emulator runs far below real time unoptimised; satx-core's
# e2e suite drives it (`saturnus://` addresses) in the test profile.
[profile.dev.package.saturnus-core]
opt-level = 3

[profile.dev.package.saturnus-drive]
opt-level = 3
