<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>saturnus</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="theme-boot.js"></script>
</head>
<body>
<!-- The icon set: stroked symbols, used as <svg class="ic"><use href="#ic-…"/></svg> (components/icons.js). -->
<svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="ic-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="ic-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  <symbol id="ic-collapse" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5"/></symbol>
  <symbol id="ic-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="ic-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="ic-chevron-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/></symbol>
  <symbol id="ic-layer" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16M17 8h1M17 11h1"/></symbol>
  <symbol id="ic-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
  <symbol id="ic-keyboard" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M9 14h6M18 14h.01"/></symbol>
  <symbol id="ic-reset" viewBox="0 0 24 24"><path d="M18.5 8.25A7.5 7.5 0 1 1 12 4.5M9.5 2 12 4.5 9.5 7"/></symbol>
  <symbol id="ic-save" viewBox="0 0 24 24"><path d="M4 14v4.5c0 .8.7 1.5 1.5 1.5h13c.8 0 1.5-.7 1.5-1.5V14M12 4v10M7.5 9.5 12 14l4.5-4.5"/></symbol>
  <symbol id="ic-load" viewBox="0 0 24 24"><path d="M4 14v4.5c0 .8.7 1.5 1.5 1.5h13c.8 0 1.5-.7 1.5-1.5V14M12 14V4M7.5 8.5 12 4l4.5 4.5"/></symbol>
  <symbol id="ic-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="ic-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="ic-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></symbol>
  <symbol id="ic-folder-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2H6l-3 8V7z"/><path d="M3 19l3-8h17l-3 8H3z"/></symbol>
  <symbol id="ic-pin" viewBox="0 0 24 24"><path d="M12 17v4"/><path d="M8 3h8l-1 7 3 3H6l3-3-1-7z"/></symbol>
  <symbol id="ic-copy-to" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 10v6M9 13h6"/></symbol>
  <symbol id="ic-move-to" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M8 13h7M12 10l3 3-3 3"/></symbol>
  <symbol id="ic-rename" viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/><path d="M9 4v16"/><path d="M7 4h4M7 20h4"/></symbol>
  <symbol id="ic-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></symbol>
  <!-- The screen as an image: a small display with two rows of print, copied (a sheet behind it) or saved (an arrow down out of it). -->
  <symbol id="ic-copy-screen" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="11" rx="1.5"/><path d="M11 12h7M11 15h4"/><path d="M5 16V6a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="ic-save-screen" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="11" rx="1.5"/><path d="M6.5 7h7M6.5 10h4"/><path d="M17 12v9M14 18l3 3 3-3"/></symbol>
  <!-- The display's contrast as brightness: one disc, long rays (lighter) or dots (darker). -->
  <symbol id="ic-lighter" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 6V2.5M16.24 7.76l2.48-2.48M18 12h3.5M16.24 16.24l2.48 2.48M12 18v3.5M7.76 16.24l-2.48 2.48M6 12H2.5M7.76 7.76 5.28 5.28"/></symbol>
  <symbol id="ic-darker" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 4h.01M17.66 6.34h.01M20 12h.01M17.66 17.66h.01M12 20h.01M6.34 17.66h.01M4 12h.01M6.34 6.34h.01"/></symbol>
</svg>

<header class="bar">
  <a class="brand" href="./"><img class="logo" src="logo.svg" alt="" width="24" height="24"><span>saturnus</span></a>
  <button id="bar-edit" class="icon" type="button" aria-disabled="true" title="Start the calculator first" aria-label="Edit"><svg class="ic" aria-hidden="true"><use href="#ic-edit"/></svg></button>
  <button id="bar-palette" class="icon" type="button" title="Search: commands, variables and actions" aria-label="Search"><svg class="ic" aria-hidden="true"><use href="#ic-search"/></svg></button>
  <button id="bar-memory" class="icon" type="button" aria-expanded="false" aria-controls="layer" title="Memory view: variables, stack, flags and the command reference" aria-label="Memory view"><svg class="ic" aria-hidden="true"><use href="#ic-layer"/></svg></button>
  <button id="bar-fullscreen" class="icon" type="button" title="Fullscreen" aria-label="Fullscreen"><svg class="ic" aria-hidden="true"><use href="#ic-expand"/></svg></button>
  <button id="bar-menu" class="icon" type="button" aria-expanded="false" aria-controls="panel" title="Controls" aria-label="Controls"><svg class="ic" aria-hidden="true"><use href="#ic-menu"/></svg></button>
</header>

<aside id="panel" class="panel" aria-label="Controls">
  <div class="panel-head">
    <a class="brand" href="./"><img class="logo" src="logo.svg" alt="" width="28" height="28"><span>saturnus</span></a>
    <button id="panel-hide" class="icon" type="button" title="Hide controls" aria-label="Hide controls"><svg class="ic" aria-hidden="true"><use href="#ic-chevron-left"/></svg></button>
  </div>
  <p class="tagline">The HP 48SX, 48GX, 49G, 38G, 39G, 40G and 42S, emulated in your browser.</p>

  <sat-controls></sat-controls>
</aside>

<div id="panel-resize" class="resize resize-panel" role="separator" aria-orientation="vertical" aria-controls="panel" aria-label="Width of the controls panel" tabindex="0" title="Drag to resize. Double-click to reset."></div>
<button id="panel-show" class="icon floating" type="button" title="Show controls" aria-label="Show controls" hidden><svg class="ic" aria-hidden="true"><use href="#ic-menu"/></svg></button>

<main id="stage" class="stage">
  <sat-calculator></sat-calculator>

  <div class="stage-tools">
    <button id="cmdline-edit" class="icon tool" type="button" aria-disabled="true" title="Start the calculator first" aria-label="Edit"><svg class="ic" aria-hidden="true"><use href="#ic-edit"/></svg></button>
    <button id="palette-show" class="icon tool" type="button" title="Search (⌘K)" aria-label="Search" aria-keyshortcuts="Meta+K"><svg class="ic" aria-hidden="true"><use href="#ic-search"/></svg><kbd class="kbd-hint tool-key" aria-hidden="true">⌘K</kbd></button>
    <button id="layer-show" class="icon tool" type="button" aria-expanded="false" aria-controls="layer" title="The calculator's variables, stack and flags, and the command reference" aria-label="Memory view"><svg class="ic" aria-hidden="true"><use href="#ic-layer"/></svg></button>
  </div>
  <button id="fs-palette" class="icon fs-tool" type="button" title="Search (or swipe down over the display)" aria-label="Search"><svg class="ic" aria-hidden="true"><use href="#ic-search"/></svg></button>
  <button id="leave-fullscreen" class="icon leave fs-tool" type="button" title="Leave fullscreen" aria-label="Leave fullscreen"><svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg></button>
</main>
<sat-explorer id="layer" hidden></sat-explorer>
<div id="layer-resize" class="resize resize-layer" role="separator" aria-orientation="vertical" aria-controls="layer" aria-label="Width of the memory view" tabindex="0" title="Drag to resize. Double-click to reset."></div>
<sat-about></sat-about>
<sat-palette></sat-palette>
<sat-shortcuts></sat-shortcuts>
<script type="module" src="app.js"></script>
</body>
</html>
