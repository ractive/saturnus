<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>saturnus</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="style.css">
<script src="shared/models.js"></script>
<script src="shared/theme-boot.js"></script>
</head>
<body>
<!-- The calculator view (app.js mountCalculator, mounted by main.js). -->
<div id="calculator-view" data-view="calculator">
<!-- The logo inline, in the model's colours (web/logo.js, style.css --logo-*). -->
<header class="bar">
  <a class="brand" href="./" data-site="landing" data-site-keep><svg class="logo" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><path class="ring" d="M 1.6 16 A 14.4 4.6 0 0 1 30.4 16" transform="rotate(-24 16 16)"/><circle class="planet" cx="16" cy="16" r="8.6"/><path class="ring" d="M 30.4 16 A 14.4 4.6 0 0 1 1.6 16" transform="rotate(-24 16 16)"/></svg><span>saturnus</span></a>
  <button id="bar-edit" class="icon" type="button" aria-disabled="true" title="Start the calculator first" aria-label="Edit"><svg class="ic" aria-hidden="true"><use href="#ic-edit"/></svg></button>
  <button id="bar-palette" class="icon" type="button" title="Search: commands, variables and actions" aria-label="Search"><svg class="ic" aria-hidden="true"><use href="#ic-search"/></svg></button>
  <button id="bar-memory" class="icon" type="button" aria-expanded="false" aria-controls="layer" title="Memory view: variables, stack, flags and the command reference" aria-label="Memory view"><svg class="ic" aria-hidden="true"><use href="#ic-layer"/></svg></button>
  <button id="bar-fullscreen" class="icon" type="button" title="Fullscreen" aria-label="Fullscreen"><svg class="ic" aria-hidden="true"><use href="#ic-expand"/></svg></button>
  <button id="bar-menu" class="icon" type="button" aria-expanded="false" aria-controls="panel" title="Controls" aria-label="Controls"><svg class="ic" aria-hidden="true"><use href="#ic-menu"/></svg></button>
</header>

<aside id="panel" class="panel" aria-label="Controls">
  <div class="panel-head">
    <a class="brand" href="./" data-site="landing" data-site-keep><svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path class="ring" d="M 1.6 16 A 14.4 4.6 0 0 1 30.4 16" transform="rotate(-24 16 16)"/><circle class="planet" cx="16" cy="16" r="8.6"/><path class="ring" d="M 30.4 16 A 14.4 4.6 0 0 1 1.6 16" transform="rotate(-24 16 16)"/></svg><span>saturnus</span></a>
    <button id="panel-hide" class="icon" type="button" title="Hide controls" aria-label="Hide controls"><svg class="ic" aria-hidden="true"><use href="#ic-chevron-left"/></svg></button>
  </div>
  <p class="tagline">The HP 48SX, 48GX, 49G, 38G, 39G, 40G, 42S, 27S, 17BII, 17B, 28S and 19BII, emulated in your browser.</p>

  <a id="to-transfer" class="site-link" href="../transfer/" data-site="transfer" title="saturnus tx: move files between calculators and this computer" hidden><svg class="ic ic-sm" aria-hidden="true"><use href="#ic-copy-to"/></svg><span>Files</span></a>

  <p id="unshared-note" class="panel-note" role="status" hidden></p>

  <sat-controls></sat-controls>
</aside>

<div id="panel-resize" class="resize resize-panel" role="separator" aria-orientation="vertical" aria-controls="panel" aria-label="Width of the controls panel" tabindex="0" title="Drag to resize. Double-click to reset."></div>
<button id="panel-show" class="icon floating" type="button" title="Show controls" aria-label="Show controls" hidden><svg class="ic" aria-hidden="true"><use href="#ic-menu"/></svg></button>

<main id="stage" class="stage">
  <sat-calculator></sat-calculator>

  <div class="stage-tools">
    <button id="cmdline-edit" class="icon tool" type="button" aria-disabled="true" title="Start the calculator first" aria-label="Edit"><svg class="ic" aria-hidden="true"><use href="#ic-edit"/></svg></button>
    <button id="palette-show" class="icon tool" type="button" title="Search (⌘K)" aria-label="Search" aria-keyshortcuts="Meta+K"><svg class="ic" aria-hidden="true"><use href="#ic-search"/></svg><kbd class="kbd-hint tool-key" aria-hidden="true">⌘K</kbd></button>
    <button id="layer-show" class="icon tool" type="button" aria-expanded="false" aria-controls="layer" title="The calculator's variables, stack and flags, and the command reference" aria-label="Memory view"><svg class="ic" aria-hidden="true"><use href="#ic-layer"/></svg></button>
  </div>
  <button id="fs-palette" class="icon fs-tool" type="button" title="Search (or swipe down over the display)" aria-label="Search"><svg class="ic" aria-hidden="true"><use href="#ic-search"/></svg></button>
  <button id="leave-fullscreen" class="icon leave fs-tool" type="button" title="Leave fullscreen" aria-label="Leave fullscreen"><svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg></button>
</main>
<sat-explorer id="layer" hidden></sat-explorer>
<div id="layer-resize" class="resize resize-layer" role="separator" aria-orientation="vertical" aria-controls="layer" aria-label="Width of the memory view" tabindex="0" title="Drag to resize. Double-click to reset."></div>
<sat-about></sat-about>
<sat-palette></sat-palette>
<sat-shortcuts></sat-shortcuts>
<sat-tour></sat-tour>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
