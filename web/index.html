<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>saturnus</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="./"><img class="logo" src="logo.svg" alt="" width="24" height="24"><span>saturnus</span></a>
  <button id="bar-palette" type="button" title="Command palette (Ctrl+K)">Commands</button>
  <button id="bar-memory" type="button" aria-expanded="false" aria-controls="layer" title="Variables, stack, flags and commands">Memory</button>
  <button id="bar-fullscreen" class="icon" type="button" title="Fullscreen" aria-label="Fullscreen">⤢</button>
  <button id="bar-menu" class="icon" type="button" aria-expanded="false" aria-controls="panel" title="Controls">☰</button>
</header>

<aside id="panel" class="panel" aria-label="Controls">
  <div class="panel-head">
    <a class="brand" href="./"><img class="logo" src="logo.svg" alt="" width="28" height="28"><span>saturnus</span></a>
    <button id="panel-hide" class="icon" type="button" title="Hide controls" aria-label="Hide controls">‹</button>
  </div>
  <p class="tagline">A clean-room emulator of the Saturn calculators, in your browser.</p>

  <sat-controls></sat-controls>
</aside>

<div id="panel-resize" class="resize resize-panel" role="separator" aria-orientation="vertical" aria-controls="panel" aria-label="Width of the controls panel" tabindex="0" title="Drag to resize; double-click for the default width"></div>
<button id="panel-show" class="icon floating" type="button" title="Show controls" aria-label="Show controls" hidden>☰</button>

<main id="stage" class="stage">
  <sat-calculator></sat-calculator>

  <div class="stage-tools">
    <button id="palette-show" class="palette-show" type="button" title="Commands, variables and actions: the command palette">Commands <kbd>⌘K</kbd></button>
    <button id="layer-show" class="layer-show" type="button" aria-expanded="false" aria-controls="layer" title="Variables, stack, flags and commands of the calculator (Alt+M)">Memory</button>
  </div>
  <button id="leave-fullscreen" class="icon leave" type="button" title="Leave fullscreen" aria-label="Leave fullscreen">✕</button>
</main>
<sat-explorer id="layer" hidden></sat-explorer>
<div id="layer-resize" class="resize resize-layer" role="separator" aria-orientation="vertical" aria-controls="layer" aria-label="Width of the memory view" tabindex="0" title="Drag to resize; double-click for the default width"></div>
<sat-about></sat-about>
<sat-palette></sat-palette>
<sat-shortcuts></sat-shortcuts>
<script type="module" src="app.js"></script>
</body>
</html>
