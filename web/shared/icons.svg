  <symbol id="ic-darker" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 4h.01M17.66 6.34h.01M20 12h.01M17.66 17.66h.01M12 20h.01M6.34 17.66h.01M4 12h.01M6.34 6.34h.01"/></symbol>
  <!-- Files: a plug (connect a calculator), the settings sliders, a refresh arrow pair, a file with a fold, a calculator. -->
  <symbol id="ic-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v4"/></symbol>
