[package]
name = "saturnus-mcp"
version = "0.1.0"
description = "MCP server for the saturnus emulator: keys, screen, stack and Kermit transfers for agents"
edition.workspace = true
license.workspace = true
repository.workspace = true
# rmcp 3 needs 1.88; the rest of the workspace stays at 1.85.
rust-version = "1.88"

[[bin]]
name = "saturnus-mcp"
path = "src/main.rs"

[dependencies]
saturnus = { path = "../saturnus" }
saturnus-drive = { path = "../saturnus-drive" }
anyhow = "1"
base64 = "0.22"
# Default features only: the `saturnus` feature would pull a second,
# older saturnus. Pinned to hptx main of 2026-10-05.
hptx-core = { git = "https://github.com/ractive/hptx", rev = "1a6cec7420ff540320c33607549eae10ecee76a1" }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[dev-dependencies]
png = "0.18"
rmcp = { version = "3.5", features = ["client"] }

[lints]
workspace = true
