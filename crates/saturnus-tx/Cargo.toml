[package]
name = "saturnus-tx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The device layer of Files: connect and detect, list, get, put, directories, rename, purge, backup, restore and PICT over satx-core's sans-I/O machine; no I/O, builds for wasm32"
readme = "README.md"
# Used by the transfer page's bindings and the desktop app, both in this
# repository (kb/docs/saturnus-tx.md, "Crates and folders").
publish = false

[lints]
workspace = true

[dependencies]
# The protocol without serial ports, TCP or the emulator: no OS I/O.
satx-core = { workspace = true }
kermit-proto.workspace = true
thiserror = "2.0.21"

[dev-dependencies]
# The recorder (`just tx-traces DIR`) drives the emulator in-process, and
# types SERVER on it again after a restore.
satx-core = { workspace = true, features = ["saturnus"] }
saturnus-drive.workspace = true
# The aplet recorder (`just tx-aplet-traces DIR`) presses the 38G's and
# 39G's keys itself, serving the link between presses.
saturnus-core.workspace = true

[[example]]
name = "record-traces"
path = "examples/record_traces.rs"

[[example]]
name = "record-aplet-traces"
path = "examples/record_aplet_traces.rs"
