[package]
name = "satx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# rustyline 19 (the REPL) uses std's cfg_select!, stable since 1.95.
rust-version = "1.95"
description = "Transfer files between HP 48 and 49G calculators and a computer over a serial cable"

[[bin]]
name = "satx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
# `native` for serial ports and TCP, `saturnus` so that released binaries
# open saturnus:// addresses too.
satx-core = { workspace = true, features = ["native", "saturnus"] }
jaq-core = "3.1.2"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.4"
kermit-proto.workspace = true
rustyline = { version = "19.0.0", default-features = false, features = ["with-file-history"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }

[lints]
workspace = true

# deb/rpm packaging for the release pipeline (ractive/release-workflows);
# the completions are generated by its pre-package-command. cargo-deb
# resolves a source in the crate directory, cargo-generate-rpm tries the
# working directory (the workspace root) first, so the rpm names this
# crate's README by its path from the root.
[package.metadata.deb]
name = "satx"
maintainer = "ractive"
section = "utils"
priority = "optional"
assets = [
    ["target/release/satx", "usr/bin/", "755"],
    ["completions/satx.bash", "usr/share/bash-completion/completions/satx", "644"],
    ["completions/_satx", "usr/share/zsh/vendor-completions/_satx", "644"],
    ["completions/satx.fish", "usr/share/fish/vendor_completions.d/satx.fish", "644"],
    ["LICENSE", "usr/share/doc/satx/", "644"],
    ["README.md", "usr/share/doc/satx/", "644"],
]
extended-description = "Transfers files between HP 48/49 calculators and a computer over a serial cable or TCP with Kermit and XModem; a CLI and REPL with JSON output for scripts and AI agents."

[package.metadata.generate-rpm]
name = "satx"
assets = [
    { source = "target/release/satx", dest = "/usr/bin/satx", mode = "755" },
    { source = "completions/satx.bash", dest = "/usr/share/bash-completion/completions/satx", mode = "644" },
    { source = "completions/_satx", dest = "/usr/share/zsh/site-functions/_satx", mode = "644" },
    { source = "completions/satx.fish", dest = "/usr/share/fish/vendor_completions.d/satx.fish", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/satx/LICENSE", mode = "644", doc = true },
    { source = "crates/satx-cli/README.md", dest = "/usr/share/doc/satx/README.md", mode = "644", doc = true },
]
