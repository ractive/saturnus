[package]
name = "saturnus-tauri"
version.workspace = true
description = "Desktop app of saturnus: the web app with the emulator core linked natively, native serial ports and the computer's files (Tauri 2)"
edition.workspace = true
license.workspace = true
repository.workspace = true
# Tauri 2.12 (tauri-build 2.7, the 2.7/2.8 plugins) needs 1.90.
rust-version = "1.90"
publish = false

[[bin]]
name = "saturnus-app"
path = "src/main.rs"

[build-dependencies]
# The front end assembled from web/ and handed to Tauri (build.rs).
serde_json = "1"
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
saturnus-core.workspace = true
saturnus-drive.workspace = true
saturnus-host.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No libudev: on Linux the ports and their USB names come from sysfs, so
# the app needs no libudev-dev to build.
serialport = { version = "4.10.1", default-features = false }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"

# Keeps macOS from napping the app (and so the emulated clock and the
# transfers' timers) while its window is in the background; the same crate
# Tauri itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }

[dev-dependencies]
saturnus-drive = { workspace = true, features = ["testing"] }
# The pseudo-terminal test (tests/serial_pty.rs): the calculator emulated
# in-process behind one end, the Kermit client on the app's serial code.
satx-core = { workspace = true, features = ["native", "saturnus"] }

[lints]
workspace = true
