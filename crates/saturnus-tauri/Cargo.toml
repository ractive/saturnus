[package]
name = "saturnus-tauri"
version.workspace = true
description = "Desktop app of the saturnus emulator: the web front end with the core linked natively (Tauri 2)"
edition.workspace = true
license.workspace = true
repository.workspace = true
# time 0.3.47 and plist 1.10 (fixed advisories, Tauri-only dependencies) need 1.88.
rust-version = "1.88"
publish = false

[[bin]]
name = "saturnus-app"
path = "src/main.rs"

[build-dependencies]
# The front end assembled from web/ and handed to Tauri (build.rs).
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
saturnus.workspace = true
saturnus-drive.workspace = true
saturnus-host.workspace = true
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Keeps macOS from napping the app (and so the emulated clock) while its
# window is in the background; the same crate Tauri itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }

[lints]
workspace = true
