[package]
name = "saturnus-refgen"
version.workspace = true
description = "Generates the command reference data: the ROM's command names per model and examples run on the emulator"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"
publish = false

[[bin]]
name = "saturnus-refgen"
path = "src/main.rs"

[dependencies]
saturnus.workspace = true
saturnus-drive.workspace = true
saturnus-kermit.workspace = true
saturnus-objects.workspace = true
saturnus-host.workspace = true
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
