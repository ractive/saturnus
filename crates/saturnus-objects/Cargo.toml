[package]
name = "saturnus-objects"
version.workspace = true
description = "HP 48/49 RPL objects for saturnus hosts: the exact object decoder and a read-only view of a paused machine's user memory (directories, stack, flags)"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/saturnus-objects"
keywords = ["emulator", "calculator", "hp48", "rpl", "saturn"]
categories = ["emulators", "parser-implementations", "wasm"]
# Sources, the README and the licence; the unit tests' fixtures are inline.
include = ["/src/**", "/README.md", "/LICENSE"]

[dependencies]
saturnus.workspace = true
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
