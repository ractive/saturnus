[package]
name = "saturnus-cli"
version = "0.1.0"
description = "Command-line front end of the saturnus emulator: run ROMs headless, script keys, dump screens, serve the serial port and the control API"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "saturnus"
path = "src/main.rs"

[dependencies]
saturnus = { path = "../saturnus" }
saturnus-drive = { path = "../saturnus-drive" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
# The control API's token: 256 bits from the OS random source.
getrandom = "0.4"
saturnus-web = { path = "../saturnus-web" }
# Inflates the embedded command reference (`saturnus ref`).
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
miniz_oxide = "0.8"

[lints]
workspace = true
