[package]
name = "saturnus-cli"
version.workspace = true
description = "Command-line front end of the saturnus emulator: run ROMs headless, script keys, dump screens, serve the serial port and the control API"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://github.com/ractive/saturnus#readme"
keywords = ["emulator", "calculator", "hp48", "hp49g", "cli"]
categories = ["emulators", "command-line-utilities"]
# The build script and the command reference it embeds (data/commands/),
# the sources, the README and the licence. tests/ stays out: the e2e tests
# need ROMs and their goldens are screen dumps of HP's ROMs.
include = ["/build.rs", "/data/commands/*.json", "/src/**", "/README.md", "/LICENSE"]

[[bin]]
name = "saturnus"
path = "src/main.rs"

[dependencies]
saturnus.workspace = true
saturnus-drive.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
# The control API's token: 256 bits from the OS random source.
getrandom = "0.4"
saturnus-host.workspace = true
# Inflates the embedded command reference (`saturnus ref`).
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
miniz_oxide = "0.9"

[lints]
workspace = true

# deb/rpm packaging for the release pipeline (ractive/release-workflows,
# kb/docs/releasing.md). The package is `saturnus-cli`, not `saturnus`: the
# desktop app's .deb and .rpm are the package `saturnus` (Tauri's
# productName), and one name would make the two replace each other. The
# binary is still /usr/bin/saturnus; the app's is saturnus-app. The docs
# are the root README and LICENSE, as `../../`: cargo-deb resolves a source
# in the crate directory, cargo-generate-rpm tries the working directory
# (the workspace root) first, so a bare `README.md` would be this crate's
# README in the .deb and the root one in the .rpm.
[package.metadata.deb]
name = "saturnus-cli"
maintainer = "ractive"
section = "utils"
priority = "optional"
assets = [
    ["target/release/saturnus", "usr/bin/", "755"],
    ["../../LICENSE", "usr/share/doc/saturnus-cli/", "644"],
    ["../../README.md", "usr/share/doc/saturnus-cli/", "644"],
]
extended-description = "Runs HP 48SX, 48GX, 49G, 38G, 39G, 40G and 42S ROMs headless: scripted keys, screen dumps, the serial port over TCP and a JSON control API. No ROM included."

[package.metadata.generate-rpm]
name = "saturnus-cli"
# A short synopsis; the crate's description is too long for one. cargo-deb
# has no such field: the .deb's synopsis is the crate's description, which
# it wraps, the rest moving into the extended description.
summary = "HP Saturn calculator emulator: ROMs headless, keys, screens, serial"
assets = [
    { source = "target/release/saturnus", dest = "/usr/bin/saturnus", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/doc/saturnus-cli/LICENSE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/saturnus-cli/README.md", mode = "644", doc = true },
]
