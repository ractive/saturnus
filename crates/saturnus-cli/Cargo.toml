[package]
name = "saturnus"
version.workspace = true
description = "The saturnus emulator of HP calculators on the command line: run ROMs, play key scripts, save screens, serve the serial port and the control API"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://github.com/ractive/saturnus#readme"
keywords = ["emulator", "calculator", "hp48", "hp49g", "cli"]
categories = ["emulators", "command-line-utilities"]
# The build script and the command reference it embeds (data/commands/),
# the sources, the README and the licence. tests/ stays out: the e2e tests
# need ROMs and their goldens are screen dumps of HP's ROMs.
include = ["/build.rs", "/data/commands/*.json", "/src/**", "/README.md", "/LICENSE"]

[[bin]]
name = "saturnus"
path = "src/main.rs"

[dependencies]
saturnus-core.workspace = true
saturnus-drive.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
saturnus-host.workspace = true
# Inflates the embedded command reference (`saturnus ref`).
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
saturnus-drive = { workspace = true, features = ["testing"] }

[build-dependencies]
miniz_oxide = "0.9"

[lints]
workspace = true

# deb/rpm packaging for the release pipeline (ractive/release-workflows,
# kb/docs/releasing.md). The package is `saturnus`, with /usr/bin/saturnus;
# the desktop app's Linux packages are `saturnus-app`
# (crates/saturnus-tauri/tauri.linux.conf.json), so the two can be
# installed side by side. The docs are the root README and LICENSE, as
# `../../`: cargo-deb resolves a source in the crate directory,
# cargo-generate-rpm tries the working directory (the workspace root)
# first, so a bare `README.md` would be this crate's README in the .deb and
# the root one in the .rpm.
[package.metadata.deb]
name = "saturnus"
maintainer = "ractive"
section = "utils"
priority = "optional"
assets = [
    ["target/release/saturnus", "usr/bin/", "755"],
    ["../../LICENSE", "usr/share/doc/saturnus/", "644"],
    ["../../README.md", "usr/share/doc/saturnus/", "644"],
]
extended-description = "Runs HP 48SX, 48GX, 49G, 38G, 39G, 40G, 42S, 27S, 17BII, 17B, 28S and 19BII ROMs headless: scripted keys, screen dumps, the serial port over TCP and a JSON control API. No ROM included."

[package.metadata.generate-rpm]
name = "saturnus"
# A short synopsis; the crate's description is too long for one. cargo-deb
# has no such field: the .deb's synopsis is the crate's description, which
# it wraps, the rest moving into the extended description.
summary = "HP Saturn calculator emulator: ROMs headless, keys, screens, serial"
assets = [
    { source = "target/release/saturnus", dest = "/usr/bin/saturnus", mode = "755" },
    { source = "../../LICENSE", dest = "/usr/share/doc/saturnus/LICENSE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/saturnus/README.md", mode = "644", doc = true },
]
