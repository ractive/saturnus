[package]
name = "satx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "HP 48/49 calculator layer of satx: Kermit and XModem driver loops, calculator operations, HP objects; blocking or sans-I/O (wasm32)"
readme = "README.md"

[lints]
workspace = true

[dependencies]
kermit-proto.workspace = true
xmodem-proto.workspace = true
# The HP character set, the stack-reply parser and the name rule (wasm-clean,
# no I/O). Brings saturnus-core, serde_json and anyhow with it, which every
# satx-core user in this workspace already builds.
saturnus-objects.workspace = true
png = "0.18.1"
serialport = { version = "4.10.1", default-features = false, optional = true }
thiserror = "2.0.21"
# The saturnus emulator, in-process (`saturnus://[MODEL@]ROM` addresses), and its
# host-side driver for the scripted boot and Kermit server start.
saturnus-core = { workspace = true, optional = true }
saturnus-drive = { workspace = true, optional = true }
# The emulated wire's rules (step, quiet line, the server's NAK).
saturnus-host = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The wall clock for the sync-marker seed of the blocking API
# (`std::time::SystemTime::now()` panics on wasm32-unknown-unknown); the
# same crate kermit-proto uses for its `Instant` there.
web-time = "1.1.0"

[features]
default = ["native"]
# Serial ports and TCP (`transport::open` of a device path or tcp://).
# Without it the crate has no OS I/O and builds for wasm32-unknown-unknown.
native = ["dep:serialport"]
# The saturnus emulator in-process (`saturnus://[MODEL@]ROM`); opt-in, satx
# turns it on.
saturnus = ["dep:saturnus-core", "dep:saturnus-drive", "dep:saturnus-host"]
