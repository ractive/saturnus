[package]
name = "saturnus-drive"
version.workspace = true
description = "Driving a saturnus machine from the host: key scripts, idle waits, scripted boot and server start, ROM loading, screen dumps, and the machine thread of the native hosts"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/saturnus-drive"
keywords = ["emulator", "calculator", "hp48", "saturn", "automation"]
categories = ["emulators"]
include = ["/src/**", "/README.md", "/LICENSE"]

[dependencies]
saturnus.workspace = true
anyhow = "1"
# Unpacks the ROM zips `fetch` downloads.
miniz_oxide = "0.9"
png = "0.18"
# The protocol's host-side pieces (Emulator, KeyQueue) for the machine
# thread (runner).
saturnus-host.workspace = true
serde = "1"
serde_json = "1"

[lints]
workspace = true
