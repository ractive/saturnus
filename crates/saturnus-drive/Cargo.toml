[package]
name = "saturnus-drive"
version = "0.1.0"
description = "Driving a saturnus machine from the host: key scripts, idle waits, scripted boot and server start, ROM loading, screen dumps, and the machine thread of the native hosts"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
saturnus = { path = "../saturnus" }
anyhow = "1"
png = "0.18"
# The protocol's host-side pieces (Emulator, KeyQueue) for the machine
# thread (runner); its wasm-bindgen parts are inert stubs natively.
saturnus-web = { path = "../saturnus-web" }
serde_json = "1"

[lints]
workspace = true
