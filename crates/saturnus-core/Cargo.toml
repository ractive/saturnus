[package]
name = "saturnus"
version.workspace = true
description = "Headless, clean-room emulator of the HP Saturn calculators (core library)"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/saturnus"
keywords = ["emulator", "calculator", "hp48", "saturn", "hp49g"]
categories = ["emulators", "wasm"]
# Published contents: sources, examples, the README and the licence.
# tests/ stays out: its golden files are screen dumps of HP's ROMs, and
# the e2e tests need ROMs anyway (kb/docs/releasing.md).
include = ["/src/**", "/examples/**", "/README.md", "/LICENSE"]

[features]
# Executed-instruction profile for timing studies (`Machine::profile`).
# Off by default; costs a hash-map update per instruction.
profile = []
# The CPU, the bus and the display renderer (`saturnus::internals`, and
# `Machine::cpu`/`hw` as public fields) for the ROM-gated tests and the
# `boot` example. Not public API: no stability promise.
internals = []

[dependencies]

# The crate itself with `internals`, for tests/e2e.rs and examples/.
[dev-dependencies]
saturnus = { path = ".", features = ["internals"] }

[[example]]
name = "boot"
required-features = ["internals"]

[lints]
workspace = true
