# Dependabot version updates (iteration 16), after hyalo's.
#
# Every update PR goes through ci.yml, so the quality gates (including
# `cargo deny check`) judge it like any other PR. Majors arrive as
# individual PRs; minor/patch updates are grouped per ecosystem.
#
# - github-actions: third-party actions are SHA-pinned with a `# vX.Y.Z`
#   comment; Dependabot updates both. First-party reusable workflows and
#   actions (ractive/release-workflows, ractive/setup-hyalo) are pinned by
#   tag by design (kb/docs/releasing.md, "Pinning policy"), so their bumps
#   are ignored here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Dependabot names a reusable workflow by its full path, so the
      # patterns need the trailing wildcard.
      - dependency-name: "ractive/release-workflows*"
      - dependency-name: "ractive/setup-hyalo*"
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
