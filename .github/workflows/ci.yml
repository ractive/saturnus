name: CI

# Structure after ~/devel/hyalo's ci.yml; policy in kb/docs/ci.md.
# Third-party actions are pinned to a commit SHA with the version in a
# comment; ractive/setup-hyalo floats on its first-party major tag
# (kb/docs/releasing.md, "Pinning policy"). `just gates` runs the same
# checks locally; keep both in sync.

on:
  pull_request:
    branches:
      - main
      - 'iter-*/**'
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR supersedes the run still going for the previous one.
# Each push to main has a group of its own: a run there checks only its
# own push's diff (`changes`), so no push run may be cancelled or replaced
# while pending by a newer one.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which parts of the repository the pull request (against its base) or
  # the push (against the previous main commit) changes; the jobs below
  # run only for the parts they check (kb/docs/ci.md, "What runs when").
  # A plain `git diff --name-only`, no third-party path-filter action
  # (kb/docs/releasing.md, "Pinning policy"). A change to this workflow,
  # a new branch or a diff that fails sets every output.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      kb: ${{ steps.filter.outputs.kb }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        # The SHAs go through the environment, not `${{ }}` expansions
        # into the script.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA...$HEAD_SHA"
          else
            range="$BEFORE..$AFTER"
          fi
          if ! files=$(git diff --name-only "$range" 2>/dev/null) \
            || grep -q -x '\.github/workflows/ci\.yml' <<<"$files"; then
            files=ALL
          fi
          echo "Changed files ($range):"
          printf '%s\n' "$files"
          out() {
            if [ "$files" = ALL ] || grep -q -E "$2" <<<"$files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi | tee -a "$GITHUB_OUTPUT"
          }
          # Rust sources (the command reference in crates/saturnus-cli/data
          # included), Cargo files and what the gates read beside them; the
          # protocol script that saturnus-drive's tests/protocol_script.rs
          # runs natively.
          out rust '^(crates/|Cargo\.(toml|lock)$|deny\.toml$|rustfmt\.toml$|LICENSE$|web/test/protocol-script\.(expected\.)?json$)'
          # The page, its tests and the scripts that generate its data.
          out web '^(web/|scripts/[^/]*\.py$)'
          out kb '^(kb/|\.hyalo\.toml$)'

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves (PRs restore main's caches): PR caches filled
          # the 10 GB Actions cache and evicted main's (kb/docs/ci.md).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Tauri app has its own job (it needs the system webview).
      - run: cargo clippy --workspace --exclude saturnus-tauri --exclude saturnus-tx-tauri --all-targets --locked -- -D warnings
      # The core's `internals` feature is on whenever the core's own test
      # targets are built (its dev-dependency on itself), and then for
      # every crate. Without them it is off, so no host or host test may
      # use it: every other crate with all targets, the core's library.
      - run: cargo clippy --workspace --exclude saturnus-core --exclude saturnus-tauri --exclude saturnus-tx-tauri --all-targets --locked -- -D warnings
      - run: cargo clippy -p saturnus-core --lib --locked -- -D warnings

  # ROM-gated tests skip themselves: SATURNUS_ROM_DIR is never set here (no
  # ROMs in the repository). The saturnng differential script needs Docker
  # and ROMs and stays local.
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves (PRs restore main's caches): PR caches filled
          # the 10 GB Actions cache and evicted main's (kb/docs/ci.md).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --exclude saturnus-tauri --exclude saturnus-tx-tauri --locked -q
      - name: Verify CLI runs
        run: cargo run --locked -p saturnus --bin saturnus -- --help

  # The static Linux CLI archive is built for x86_64-unknown-linux-musl;
  # release.yml builds it without tests (kb/docs/releasing.md), so its
  # tests run here, natively on the x86_64 runner (musl-tools, no cross).
  test-musl:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves (PRs restore main's caches): PR caches filled
          # the 10 GB Actions cache and evicted main's (kb/docs/ci.md).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo test --workspace --exclude saturnus-tauri --exclude saturnus-tx-tauri --locked -q --target x86_64-unknown-linux-musl
      - name: Verify CLI runs
        run: cargo run --locked -p saturnus --bin saturnus --target x86_64-unknown-linux-musl -- --help

  # The published crates build with the workspace's rust-version (the
  # minimum it claims; kb/docs/ci.md). Bump both together.
  msrv:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves (PRs restore main's caches): PR caches filled
          # the 10 GB Actions cache and evicted main's (kb/docs/ci.md).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked -p saturnus-core -p saturnus-objects -p saturnus-host -p saturnus-drive -p saturnus -p kermit-proto -p xmodem-proto -p satx-core
      # satx has its own rust-version (1.89, rustyline's file locks).
      - name: satx with its rust-version
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked -p satx

  # The core crate must build for wasm32 (no I/O, no threads); the browser
  # UI's package is what web/build.sh produces with wasm-pack.
  wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves (PRs restore main's caches): PR caches filled
          # the 10 GB Actions cache and evicted main's (kb/docs/ci.md).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack@0.15.0
          # Only the checksummed prebuilt binary from install-action's
          # manifest, never a cargo-binstall or cargo-install fallback.
          fallback: none
      - name: Core, host and protocol crates build for wasm32
        run: cargo check -p saturnus-core -p saturnus-host -p kermit-proto -p xmodem-proto --target wasm32-unknown-unknown --locked
      # satx-core without its default features (no serial port, no TCP, no
      # in-process emulator) is the protocol core of saturnus-tx in the
      # browser: it must build for wasm32 and pass clippy on its own.
      - name: satx-core builds for wasm32 without default features
        run: cargo check -p satx-core --no-default-features --target wasm32-unknown-unknown --locked
      - name: Clippy on satx-core without default features
        run: cargo clippy --locked -p satx-core --no-default-features --all-targets -- -D warnings
      # saturnus-tx (the transfer page's device layer) sits on that build of
      # satx-core and must build for wasm32 too.
      - name: saturnus-tx builds for wasm32
        run: cargo check -p saturnus-tx --target wasm32-unknown-unknown --locked
      - name: Web package (wasm-pack)
        run: web/build.sh -- --locked
      - name: Native tests of the web bindings and the host crate
        run: cargo test -p saturnus-web -p saturnus-host --locked -q
      # The page's pure functions (web/objects.js), with the runner's Node.
      - name: Page function tests
        run: node --test --test-timeout=300000 web/test/*.test.mjs

  # saturnus tx, the transfer page (web/tx.html, web/tx/): its bindings
  # (crates/saturnus-tx-web) build for wasm32 and pass their native tests;
  # both wasm packages are built (the page loads the emulator's for its
  # emulated calculator), then the transfer tests run: the pure modules,
  # the protocol stack over saturnus-tx's recorded traces, the page in
  # headless Chrome with a recorded fake link (connect, list, put with
  # replace, overflow at five widths in both themes), and the site with
  # both subsites. The emulated calculators' run is local (`just tx-e2e`).
  # Paths: crates/saturnus-tx* are in the rust filter, web/tx*, web/tx/
  # and web/test/tx-* in the web filter.
  wasm-tx:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves, as in `wasm` (kb/docs/ci.md).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: saturnus-tx-web builds for wasm32
        run: cargo check -p saturnus-tx-web --target wasm32-unknown-unknown --locked
      - name: Native tests of the transfer bindings
        run: cargo test -p saturnus-tx-web --locked -q
      - name: Web package (wasm-pack)
        run: web/build.sh -- --locked
      - name: Transfer page's package (wasm-pack)
        run: web/tx-build.sh -- --locked
      - name: Transfer tests and the site
        run: node --test --test-timeout=300000 web/test/tx-*.test.mjs web/test/site.test.mjs web/test/storage-names.test.mjs web/test/icons.test.mjs

  # The Tauri apps (crates/saturnus-tauri, crates/saturnus-tx-tauri; the
  # latter's page wasm is not built here, its build script only warns, and
  # its ROM-gated pseudo-terminal test skips) link the system webview, which
  # on Linux needs webkit2gtk and friends, so it is outside the workspace's
  # default members and the jobs above exclude it; here it gets the
  # libraries, clippy and its tests (the ROM-gated one skips). Installers
  # are built by desktop.yml. kb/docs/ci.md has the reasoning.
  tauri:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves (PRs restore main's caches): PR caches filled
          # the 10 GB Actions cache and evicted main's (kb/docs/ci.md).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
      - run: cargo clippy -p saturnus-tauri -p saturnus-tx-tauri --all-targets --locked -- -D warnings
      # Release builds leave out the debug-only test hooks: they must
      # compile without them (a command lost its cfg once, PR 88).
      - run: cargo clippy -p saturnus-tauri -p saturnus-tx-tauri --release --all-targets --locked -- -D warnings
      - run: cargo test -p saturnus-tauri -p saturnus-tx-tauri --locked -q

  # The Tauri apps' tests on Windows too (WebView2 is on the runner, no
  # extra libraries): paths differ there (`\\?\` verbatim prefixes, drive
  # letters), and the 0.3.0 release dry run caught a Windows-only test bug
  # that the Linux `tauri` job missed. Tests only; clippy stays on Linux.
  tauri-windows:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves (PRs restore main's caches): PR caches filled
          # the 10 GB Actions cache and evicted main's (kb/docs/ci.md).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p saturnus-tauri -p saturnus-tx-tauri --locked -q

  # Every commit a pull request brings has the author email
  # james@ractive.ch (CLAUDE.md, "PR discipline"); only dependabot is
  # exempt. The base ref goes through the environment (no injection
  # through a branch name).
  commit-email:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Author emails
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          bad=$(git log --format='%h %an <%ae>' "origin/$BASE_REF..HEAD" \
            | grep -v -E ' <james@ractive\.ch>$' \
            | grep -v -E ' dependabot\[bot\] <[^>]*>$' || true)
          if [ -n "$bad" ]; then
            echo "::error::commits with an author email other than james@ractive.ch:"
            echo "$bad"
            exit 1
          fi

  # Diff-aware kb lint on pull requests, full-vault lint on pushes to main,
  # as in hyalo (see its ci.yml for the annotation-cap reasoning).
  # `.hyalo.toml` at the repo root sets `dir = "kb"`.
  lint-kb:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.kb == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ractive/setup-hyalo@v1
      - name: Lint changed knowledgebase files
        # The base ref goes through the environment, not a `${{ }}`
        # expansion into the script (no injection through a branch name).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" \
            | hyalo lint --strict --files-from - --format github

  lint-kb-full:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.kb == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ractive/setup-hyalo@v1
      - name: Lint full knowledgebase
        run: hyalo lint --strict --format github

  # Supply-chain policy (deny.toml, kb/decision-log.md iteration 16), the
  # publish rehearsal and the page's generated data. Runs when Rust or web
  # files change. `just gates` runs the same locally.
  quality-gates:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependency advisories, licences, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves (PRs restore main's caches): PR caches filled
          # the 10 GB Actions cache and evicted main's (kb/docs/ci.md).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The publish rehearsal (`just package`): the crates.io crates, in the
      # order of release.yml's publish-crates, packaged and each verified
      # by a build against the packages before it, through a temporary
      # local registry; no crates.io, no token (kb/docs/releasing.md). The
      # warnings that tests/ is not packaged are expected (`include`).
      # Each published crate carries a copy of the licence (not a link, which
      # a checkout without symlinks would package as a stub); it must match.
      - name: Published crates carry the licence
        run: for c in saturnus-core saturnus-objects saturnus-host saturnus-drive saturnus-cli kermit-proto xmodem-proto satx-core satx-cli; do cmp LICENSE "crates/$c/LICENSE"; done
      - name: Published crates package and verify (rehearsal)
        run: cargo package --locked -p kermit-proto -p xmodem-proto -p saturnus-core -p saturnus-objects -p saturnus-host -p saturnus-drive -p saturnus -p satx-core -p satx
      # The published crates' docs as docs.rs builds them (`just doc`).
      - name: Published crates document without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --locked -p saturnus-core -p saturnus-objects -p saturnus-host -p saturnus-drive -p kermit-proto -p xmodem-proto -p satx-core -p saturnus -p satx
      # web/about.json is generated from the hardware wiki, which is not in
      # the repository; the committed file must name no local path or
      # e-mail address (it is shown on the public page).
      - name: About panel names nothing private
        run: python3 scripts/about-json.py --check
      # web/flags.json likewise (generated by scripts/flags-json.py).
      - name: Flag meanings are well-formed and name nothing private
        run: python3 scripts/flags-json.py --check
      # web/commands.json is folded from data/commands/ by
      # scripts/commands-json.py; the committed file must be current.
      - name: Command palette data is current
        run: python3 scripts/commands-json.py --check
