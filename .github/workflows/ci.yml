name: CI

# Structure after ~/devel/hyalo's ci.yml; policy in kb/docs/ci.md.
# Third-party actions are pinned to a commit SHA with the version in a
# comment; ractive/setup-hyalo floats on its first-party major tag
# (kb/docs/releasing.md, "Pinning policy"). `just gates` runs the same
# checks locally; keep both in sync.

on:
  pull_request:
    branches:
      - main
      - 'iter-*/**'
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR supersedes the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The Tauri app has its own job (it needs the system webview).
      - run: cargo clippy --workspace --exclude saturnus-tauri --all-targets --locked -- -D warnings
      # The core's `internals` feature is on whenever the core's own test
      # targets are built (its dev-dependency on itself), and then for
      # every crate. Without them it is off, so no host or host test may
      # use it: every other crate with all targets, the core's library.
      - run: cargo clippy --workspace --exclude saturnus-core --exclude saturnus-tauri --all-targets --locked -- -D warnings
      - run: cargo clippy -p saturnus-core --lib --locked -- -D warnings

  # ROM-gated tests skip themselves: SATURNUS_ROM_DIR is never set here (no
  # ROMs in the repository). The saturnng differential script needs Docker
  # and ROMs and stays local.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --exclude saturnus-tauri --locked -q
      - name: Verify CLI runs
        run: cargo run --locked -p saturnus --bin saturnus -- --help

  # The static Linux CLI archive is built for x86_64-unknown-linux-musl;
  # release.yml builds it without tests (kb/docs/releasing.md), so its
  # tests run here, natively on the x86_64 runner (musl-tools, no cross).
  test-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo test --workspace --exclude saturnus-tauri --locked -q --target x86_64-unknown-linux-musl
      - name: Verify CLI runs
        run: cargo run --locked -p saturnus --bin saturnus --target x86_64-unknown-linux-musl -- --help

  # The published crates build with the workspace's rust-version (the
  # minimum it claims; kb/docs/ci.md). Bump both together.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked -p saturnus-core -p saturnus-objects -p saturnus-host -p saturnus-drive -p saturnus -p kermit-proto -p xmodem-proto -p satx-core
      # satx has its own rust-version (1.89, rustyline's file locks).
      - name: satx with its rust-version
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked -p satx

  # The core crate must build for wasm32 (no I/O, no threads); the browser
  # UI's package is what web/build.sh produces with wasm-pack.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack@0.15.0
          # Only the checksummed prebuilt binary from install-action's
          # manifest, never a cargo-binstall or cargo-install fallback.
          fallback: none
      - name: Core, host and protocol crates build for wasm32
        run: cargo check -p saturnus-core -p saturnus-host -p kermit-proto -p xmodem-proto --target wasm32-unknown-unknown --locked
      # satx-core without its default features (no serial port, no TCP, no
      # in-process emulator) is the protocol core of saturnus-tx in the
      # browser: it must build for wasm32 and pass clippy on its own.
      - name: satx-core builds for wasm32 without default features
        run: cargo check -p satx-core --no-default-features --target wasm32-unknown-unknown --locked
      - name: Clippy on satx-core without default features
        run: cargo clippy --locked -p satx-core --no-default-features --all-targets -- -D warnings
      # saturnus-tx (the transfer page's device layer) sits on that build of
      # satx-core and must build for wasm32 too.
      - name: saturnus-tx builds for wasm32
        run: cargo check -p saturnus-tx --target wasm32-unknown-unknown --locked
      - name: Web package (wasm-pack)
        run: web/build.sh -- --locked
      - name: Native tests of the web bindings and the host crate
        run: cargo test -p saturnus-web -p saturnus-host --locked -q
      # The page's pure functions (web/objects.js), with the runner's Node.
      - name: Page function tests
        run: node --test --test-timeout=300000 web/test/*.test.mjs

  # The Tauri app (crates/saturnus-tauri) links the system webview, which
  # on Linux needs webkit2gtk and friends, so it is outside the workspace's
  # default members and the jobs above exclude it; here it gets the
  # libraries, clippy and its tests (the ROM-gated one skips). Installers
  # are built by desktop.yml. kb/docs/ci.md has the reasoning.
  tauri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
      - run: cargo clippy -p saturnus-tauri --all-targets --locked -- -D warnings
      # Release builds leave out the debug-only test hooks: they must
      # compile without them (a command lost its cfg once, PR 88).
      - run: cargo clippy -p saturnus-tauri --release --all-targets --locked -- -D warnings
      - run: cargo test -p saturnus-tauri --locked -q

  # Every commit a pull request brings has the author email
  # james@ractive.ch (CLAUDE.md, "PR discipline"); only dependabot is
  # exempt. The base ref goes through the environment (no injection
  # through a branch name).
  commit-email:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Author emails
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          bad=$(git log --format='%h %an <%ae>' "origin/$BASE_REF..HEAD" \
            | grep -v -E ' <james@ractive\.ch>$' \
            | grep -v -E ' dependabot\[bot\] <[^>]*>$' || true)
          if [ -n "$bad" ]; then
            echo "::error::commits with an author email other than james@ractive.ch:"
            echo "$bad"
            exit 1
          fi

  # satx against the saturnng oracle (tools/saturnng-oracle/), the
  # black-box reference kb/docs/clean-room-rule.md allows: the image
  # downloads the ROMs from hpcalc.org at build time and is never cached,
  # pushed or shipped. Ports 4848 and 4850 belong to these containers.
  satx-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the oracle image
        run: docker build -t hp49g-emu tools/saturnng-oracle
      - name: Start HP 48SX and HP 49G
        run: |
          docker run -d -p 4848:4848 -e MODEL=48sx --name calc hp49g-emu
          docker run -d -p 4850:4848 -e MODEL=49g --name calc49 hp49g-emu
          for c in calc calc49; do
            timeout 90 sh -c "until docker logs $c 2>&1 | grep -q bridged; do sleep 1; done"
          done
      - name: satx-core end-to-end tests, 48SX
        env:
          SATX_E2E_ADDR: tcp://localhost:4848
          SATX_E2E_CONTAINER: calc
        run: cargo test --locked -p satx-core --test e2e -- --nocapture
      - name: satx-core end-to-end tests, 49G
        env:
          SATX_E2E_ADDR: tcp://localhost:4850
          SATX_E2E_CONTAINER: calc49
        run: cargo test --locked -p satx-core --test e2e -- --nocapture
      - name: CLI end-to-end script, 48SX
        env:
          SATX_E2E_ADDR: tcp://localhost:4848
          SATX_E2E_MODEL: 48sx
          # The 48SX has no XModem: the script checks that it is refused.
          SATX_E2E_CONTAINER: calc
        run: scripts/satx-e2e-cli.sh
      # After the satx-core suite the emulated 49G is regularly wedged (no
      # answer even after SERVER is retyped; see
      # kb/backlog/satx-flaky-xmodem-e2e.md). Give the CLI script a fresh
      # calculator instead of inheriting that state.
      - name: Restart HP 49G
        run: |
          docker rm -f calc49
          docker run -d -p 4850:4848 -e MODEL=49g --name calc49 hp49g-emu
          timeout 90 sh -c 'until docker logs calc49 2>&1 | grep -q bridged; do sleep 1; done'
          sleep 15
      - name: CLI end-to-end script, 49G
        env:
          SATX_E2E_ADDR: tcp://localhost:4850
          SATX_E2E_MODEL: 49g
          # XModem steps type XRECV/XSEND/SERVER via docker exec calc49 calc-keys.
          SATX_E2E_CONTAINER: calc49
        run: scripts/satx-e2e-cli.sh
      - name: Screens and logs on failure
        if: failure()
        run: |
          for c in calc calc49; do
            echo "::group::$c"
            docker exec $c calc-screen || true
            docker exec $c cat /tmp/saturn.log || true
            docker logs $c
            echo "::endgroup::"
          done

  # Diff-aware kb lint on pull requests, full-vault lint on pushes to main,
  # as in hyalo (see its ci.yml for the annotation-cap reasoning).
  # `.hyalo.toml` at the repo root sets `dir = "kb"`.
  lint-kb:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ractive/setup-hyalo@v1
      - name: Lint changed knowledgebase files
        # The base ref goes through the environment, not a `${{ }}`
        # expansion into the script (no injection through a branch name).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" \
            | hyalo lint --strict --files-from - --format github

  lint-kb-full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ractive/setup-hyalo@v1
      - name: Lint full knowledgebase
        run: hyalo lint --strict --format github

  # Supply-chain policy (deny.toml, kb/decision-log.md iteration 16). Runs on
  # every PR and every push to main. `just gates` runs the same locally.
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependency advisories, licences, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The publish rehearsal (`just package`): the crates.io crates, in the
      # order of release.yml's publish-crates, packaged and each verified
      # by a build against the packages before it, through a temporary
      # local registry; no crates.io, no token (kb/docs/releasing.md). The
      # warnings that tests/ is not packaged are expected (`include`).
      # Each published crate carries a copy of the licence (not a link, which
      # a checkout without symlinks would package as a stub); it must match.
      - name: Published crates carry the licence
        run: for c in saturnus-core saturnus-objects saturnus-host saturnus-drive saturnus-cli kermit-proto xmodem-proto satx-core satx-cli; do cmp LICENSE "crates/$c/LICENSE"; done
      - name: Published crates package and verify (rehearsal)
        run: cargo package --locked -p kermit-proto -p xmodem-proto -p saturnus-core -p saturnus-objects -p saturnus-host -p saturnus-drive -p saturnus -p satx-core -p satx
      # The published crates' docs as docs.rs builds them (`just doc`).
      - name: Published crates document without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps --locked -p saturnus-core -p saturnus-objects -p saturnus-host -p saturnus-drive -p kermit-proto -p xmodem-proto -p satx-core -p saturnus -p satx
      # web/about.json is generated from the hardware wiki, which is not in
      # the repository; the committed file must name no local path or
      # e-mail address (it is shown on the public page).
      - name: About panel names nothing private
        run: python3 scripts/about-json.py --check
      # web/flags.json likewise (generated by scripts/flags-json.py).
      - name: Flag meanings are well-formed and name nothing private
        run: python3 scripts/flags-json.py --check
      # web/commands.json is folded from data/commands/ by
      # scripts/commands-json.py; the committed file must be current.
      - name: Command palette data is current
        run: python3 scripts/commands-json.py --check
