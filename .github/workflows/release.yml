name: Release

# A thin caller of the shared release pipeline (ractive/release-workflows,
# first-party, pinned by tag: kb/docs/releasing.md). A published GitHub
# release builds, tests and uploads the `saturnus` CLI archives; a manual run
# (workflow_dispatch) is a dry run that only uploads workflow artifacts.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: ractive/release-workflows/.github/workflows/release.yml@v0.2.1
    secrets: inherit
    with:
      # The shared workflow packages one binary per archive
      # (kb/docs/releasing.md).
      bin-name: saturnus
      version-package: saturnus-cli
      # crates.io, in dependency order (CARGO_TOKEN secret); the shared
      # workflow retries a crate while the index has not caught up with the
      # one before it, and skips one that is already up. Keep in sync with
      # publish-crates.yml and `just package` (kb/docs/releasing.md). The
      # other crates are `publish = false`.
      publish-crates: saturnus,saturnus-objects,saturnus-host,saturnus-drive,saturnus-cli
      # Left off on purpose (kb/docs/releasing.md): winget-identifier (the
      # first winget submission is a manual PR to microsoft/winget-pkgs),
      # cloudsmith-repo and enable-linux-packages (a Cloudsmith repository
      # and deb/rpm metadata first), aur-package (an AUR account and key).
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
      # hyalo's matrix: the two QEMU-emulated aarch64 Linux targets and
      # Windows on ARM build only; tests run on the native targets (and on
      # every PR in ci.yml). The x86_64 Linux targets build only too: the
      # shared workflow runs `cargo test --workspace`, which takes in
      # saturnus-tauri and its webkit2gtk/glib system libraries, absent on
      # its runners; ci.yml tests every other crate on Linux, and the
      # desktop app in its own job (kb/docs/ci.md).
      targets: >-
        [
          {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest", "cross": false, "run_tests": false},
          {"target": "x86_64-unknown-linux-musl", "os": "ubuntu-latest", "cross": true, "run_tests": false},
          {"target": "aarch64-unknown-linux-gnu", "os": "ubuntu-latest", "cross": true, "run_tests": false},
          {"target": "aarch64-unknown-linux-musl", "os": "ubuntu-latest", "cross": true, "run_tests": false},
          {"target": "aarch64-apple-darwin", "os": "macos-latest", "cross": false, "run_tests": true},
          {"target": "x86_64-pc-windows-msvc", "os": "windows-latest", "cross": false, "run_tests": true},
          {"target": "aarch64-pc-windows-msvc", "os": "windows-latest", "cross": false, "run_tests": false}
        ]
