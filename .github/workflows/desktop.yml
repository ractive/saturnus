name: Desktop app

# Builds the desktop app (crates/saturnus-tauri: Calculator with the core
# natively, Files with its protocol in the page's wasm; one app since
# iteration 51) into installers on macOS, Windows and Linux with Tauri's
# official action. A release runs it with its tag once
# release.yml succeeded: it builds that tag and attaches the installers. By
# hand (kb/docs/releasing.md, "Desktop app") a run uploads the installers
# as workflow artifacts, or with `release-tag` does what a release does
# (a rebuild).
# The macOS app is signed and notarised when the Apple secrets exist
# (the same six as release-workflows' docs/macos-signing.md) and the run
# builds a release tag or main; otherwise it builds unsigned. A signed build with a release tag
# also updates the Homebrew cask saturnus-app (the `cask` job).
# Third-party actions are pinned to a commit SHA with the version in a
# comment (kb/docs/releasing.md, "Pinning policy").

on:
  # A release builds the app from its tag, attaches the installers and
  # updates the cask once release.yml (run by the published release,
  # whose run's head_branch is the tag) has succeeded: a failed release
  # gets no installers and moves no cask. Its dry runs (dispatched) start
  # nothing here.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing release tag to attach the installers to (empty: workflow artifacts only)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.12.1

jobs:
  # With a release tag: the tag must be a published (not draft) release
  # whose commit is on main, so no tag pushed from another branch gets a
  # signed build. Without one there is nothing to check.
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag) != ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a published release on main
        if: (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag) != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag }}
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft) || {
            echo "::error::$TAG is not a release visible to this run (missing or a draft)"
            exit 1
          }
          if [ "$draft" != "false" ]; then
            echo "::error::$TAG is a draft release"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main; then
            echo "::error::$TAG's commit is not on main"
            exit 1
          fi

  build:
    name: build (${{ matrix.platform.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            name: macos-aarch64
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-22.04
            name: linux-x86_64
          # GitHub's native ARM runners (free for public repositories);
          # the Linux one on 22.04 like x86_64, for the same glibc reach.
          - os: windows-11-arm
            name: windows-aarch64
          - os: ubuntu-22.04-arm
            name: linux-aarch64
    runs-on: ${{ matrix.platform.os }}
    # The Apple secrets live in the `release` environment (deployments from
    # main and v* tags only, set in the repository's settings); a run that
    # does not sign runs in `unsigned` (no secrets, no branch policy) and
    # so sees none of them.
    environment: ${{ ((github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag) != '' || github.ref == 'refs/heads/main') && 'release' || 'unsigned' }}
    # `secrets` cannot appear in a step's `if:`; this flag carries "the
    # certificate secret is set" to the macOS signing steps. Only a build
    # of a release tag or of main is signed: a run dispatched on another
    # branch builds unsigned, so no branch's code gets the Developer ID.
    env:
      MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && ((github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag) != '' || github.ref == 'refs/heads/main') }}
    steps:
      # With a release tag, build exactly that tag (the checkout fails if
      # it does not exist), so what is attached to a release is what the
      # release is; otherwise the dispatched ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag) != '' && format('refs/tags/{0}', github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag) || github.ref }}
          persist-credentials: false
      # Files' protocol, aplet server and private calculators run in the
      # page's wasm, built by the app's beforeBuildCommand (wasm-pack, the
      # wasm32 target).
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
          # Only the checksummed prebuilt binary, as in ci.yml.
          fallback: none
      # The system webview and the bundlers' tools (Tauri's Linux
      # prerequisites; 22.04 for the widest glibc reach of the AppImage).
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Build the installers
        if: env.MACOS_SIGNING != 'true' || runner.os != 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: crates/saturnus-tauri
          tauriScript: cargo tauri
          args: --ci
      # Signed macOS build. A separate step because the Tauri bundler
      # treats a variable that is set but empty as given (an empty
      # APPLE_CERTIFICATE fails the import), so the unsigned build must
      # not see these names at all. Tauri imports the certificate into a
      # temporary keychain it deletes itself, signs with the hardened
      # runtime, notarises and staples the .app, and signs the .dmg. Its
      # APPLE_API_KEY is the key ID; the .p8 goes in as a file path.
      # Tauri imports only the .p12, which holds the leaf and its key but
      # not Apple's "Developer ID - G2" intermediate, so codesign may fail
      # to build the chain. Tauri keeps the existing keychain search list
      # and adds its own, so the intermediate goes into a keychain of its
      # own on that list. Pinned: SHA-256 of
      # https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
      # (CN=Developer ID Certification Authority, OU=G2; expires 2031-09-17).
      - name: Developer ID G2 intermediate (macOS)
        if: env.MACOS_SIGNING == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sha256="f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          cer="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          keychain="$RUNNER_TEMP/developer-id-g2.keychain-db"
          curl -fsSL --retry 3 -o "$cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          if [ "$(shasum -a 256 "$cer" | cut -d ' ' -f 1)" != "$sha256" ]; then
            echo "DeveloperIDG2CA.cer does not match the pinned SHA-256; Apple may have reissued it, check and update it here" >&2
            exit 1
          fi
          security create-keychain -p "" "$keychain"
          security import "$cer" -k "$keychain"
          read -r -a current <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" "${current[@]}"
          security list-keychains -d user
      - name: Notarisation key file (macOS)
        if: env.MACOS_SIGNING == 'true' && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/notary/AuthKey.p8"
          mkdir -p "$(dirname "$key")"
          # The secret is the base64 of the .p8; raw PEM text works too.
          case "$APPLE_API_KEY_P8" in
            -----BEGIN*) printf '%s\n' "$APPLE_API_KEY_P8" > "$key" ;;
            *) printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key" ;;
          esac
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Build, sign and notarise the installers (macOS)
        if: env.MACOS_SIGNING == 'true' && runner.os == 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        with:
          projectPath: crates/saturnus-tauri
          tauriScript: cargo tauri
          args: --ci
      # Tauri notarises the .app only; the .dmg around it is signed but not
      # notarised, so it is submitted and stapled here, then everything is
      # checked the way Gatekeeper will.
      - name: Notarise the disk image and verify (macOS)
        if: env.MACOS_SIGNING == 'true' && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(target/release/bundle/macos/*.app)
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#dmgs[@]}" -ne 1 ]; then
            echo "expected one .app and one .dmg, got ${#apps[@]}/${#dmgs[@]}" >&2
            exit 1
          fi
          app="${apps[0]}"
          dmg="${dmgs[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          notary() {
            xcrun notarytool "$@" --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          }
          result=$(notary submit "$dmg" --wait --timeout 30m --output-format json) || true
          echo "$result"
          status=$(jq -r '.status // empty' <<< "$result" 2> /dev/null || true)
          id=$(jq -r '.id // empty' <<< "$result" 2> /dev/null || true)
          message=$(jq -r '.message // empty' <<< "$result" 2> /dev/null || true)
          echo "Notarisation submission id: ${id:-none}"
          # --wait gave up, Apple did not: a new team's first submissions can
          # take hours, later ones minutes.
          if [ -z "$status" ] && [ -n "$id" ] && [[ "$message" == *Timeout* ]]; then
            echo "Apple has not finished checking submission ${id} after 30 min; it goes on at Apple. Check with \`xcrun notarytool info ${id} --key AuthKey_<key id>.p8 --key-id <key id> --issuer <issuer id>\` and rerun the job when it is Accepted." >&2
            exit 1
          fi
          if [ "$status" != "Accepted" ]; then
            echo "notarisation of the .dmg ended with status '${status:-none}'" >&2
            if [ -n "$id" ]; then
              notary log "$id" || true
            fi
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - name: Remove the notarisation key and keychain (macOS)
        if: always() && env.MACOS_SIGNING == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/notary"
          security delete-keychain "$RUNNER_TEMP/developer-id-g2.keychain-db" 2> /dev/null || true
      # Named after the product (saturnus_V_aarch64.dmg, as the cask
      # expects); a space in a name would become a dot in a release asset,
      # so it becomes a hyphen here.
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist
          for d in dmg macos msi nsis deb rpm appimage; do
            dir="target/release/bundle/$d"
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 1 -type f \
              \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
                 -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          done
          for f in dist/*' '*; do
            [ -e "$f" ] || continue
            mv "$f" "dist/$(basename "$f" | tr ' ' '-')"
          done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturnus-app-${{ matrix.platform.name }}
          path: dist/
          if-no-files-found: error

  # Only with a release tag: attach the installers to that release. The
  # one job that may write, and it builds nothing.
  attach:
    if: (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag) != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # One directory per platform's artifact.
          pattern: saturnus-app-*
          path: artifacts
      # One checksums file for the installers (saturnus-app-SHA256SUMS; the
      # CLIs' release has saturnus-SHA256SUMS and satx-SHA256SUMS), in
      # `sha256sum --check` format, uploaded with them.
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          names=()
          for f in artifacts/saturnus-app-*/*; do
            cp "$f" dist/
            names+=("$(basename "$f")")
          done
          [ "${#names[@]}" -gt 0 ] || { echo "no installers" >&2; exit 1; }
          (cd dist && sha256sum "${names[@]}") > dist/saturnus-app-SHA256SUMS
          cat dist/saturnus-app-SHA256SUMS
      - name: Upload to the release
        # The tag goes through the environment, not a `${{ }}` expansion
        # into the script.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag }}
        # No --clobber: a release's installers are never replaced; a rerun
        # fails on assets that already exist (delete them by hand first).
        run: gh release upload "$TAG" dist/*

  # Only with a release tag and the Apple secrets: point the Homebrew cask
  # `saturnus-app` in ractive/homebrew-tap at this release's .dmg, the way
  # release-workflows updates the CLI formula there (a direct commit with
  # HOMEBREW_TAP_TOKEN), rendered from packaging/homebrew/saturnus-app.rb.
  # It never publishes an unsigned app: the .dmg is downloaded from the
  # release and must pass Gatekeeper (Developer ID, notarised, stapled)
  # before anything is pushed.
  cask:
    if: (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag) != ''
    needs: attach
    runs-on: macos-latest
    # HOMEBREW_TAP_TOKEN and the Apple secrets live in `release`.
    environment: release
    permissions:
      contents: read
    # `secrets` cannot appear in `if:`; without the certificate secret the
    # build was unsigned and every step below skips.
    env:
      MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      CASK: saturnus-app
      DMG_PREFIX: saturnus
      BUNDLE: saturnus.app
      BUNDLE_ID: ch.ractive.saturnus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.MACOS_SIGNING == 'true'
        with:
          ref: refs/tags/${{ github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag }}
          persist-credentials: false
      - name: Check the release and download its .dmg
        if: env.MACOS_SIGNING == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || inputs.release-tag }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice::$1; the cask is left alone"
            echo "CASK_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          }
          # With contents: read a draft is invisible, so a failed lookup is
          # a draft (or no release at all); a pre-release is not for
          # `brew upgrade`.
          if ! state=$(gh release view "$TAG" --json isDraft,isPrerelease \
                       --jq '"\(.isDraft) \(.isPrerelease)"' 2> /dev/null); then
            skip "$TAG is not a published release visible to this job (a draft?)"
          fi
          [ "$state" = "false false" ] || skip "$TAG is a draft or a pre-release"
          # Only the latest release may move the cask: an older tag
          # dispatched later must not roll it back.
          latest=$(gh release view --json tagName --jq .tagName)
          [ "$TAG" = "$latest" ] || skip "$TAG is not the latest release ($latest)"
          version="${TAG#v}"
          # And never below what the tap already has. The tap is public:
          # cloned without credentials, the token comes in only for the push.
          git clone --depth 1 https://github.com/ractive/homebrew-tap.git tap
          current=""
          if [ -f "tap/Casks/$CASK.rb" ]; then
            current=$(sed -n 's/^  version "\(.*\)"$/\1/p' "tap/Casks/$CASK.rb")
          fi
          if [ -n "$current" ] && [ "$current" != "$version" ]; then
            newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n 1)
            [ "$newest" = "$version" ] || skip "the tap's cask is at $current, newer than $version"
          fi
          dmg="${DMG_PREFIX}_${version}_aarch64.dmg"
          mkdir dmg
          gh release download "$TAG" --pattern "$dmg" --dir dmg
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DMG=dmg/$dmg" >> "$GITHUB_ENV"
      - name: Check the .dmg is signed, notarised and the right app
        if: env.MACOS_SIGNING == 'true' && env.CASK_SKIP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG" > /dev/null
          trap 'hdiutil detach -quiet "$mnt"' EXIT
          app="$mnt/$BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature=$(codesign --display --verbose=2 "$app" 2>&1)
          grep -q '^Authority=Developer ID Application:' <<< "$signature"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          plist="$app/Contents/Info.plist"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          if [ "$id" != "$BUNDLE_ID" ] || [ "$ver" != "$VERSION" ]; then
            echo "expected $BUNDLE_ID $VERSION, the .dmg holds $id $ver" >&2
            exit 1
          fi
      - name: Update the cask in the tap
        if: env.MACOS_SIGNING == 'true' && env.CASK_SKIP != 'true'
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set" >&2
            exit 1
          fi
          sha=$(shasum -a 256 "$DMG" | cut -d ' ' -f 1)
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@SHA256@/${sha}/" \
            "packaging/homebrew/$CASK.rb" > "$CASK.rb"
          if grep -q '@[A-Z0-9]*@' "$CASK.rb"; then
            echo "packaging/homebrew/$CASK.rb has a placeholder left" >&2
            exit 1
          fi
          cat "$CASK.rb"
          mkdir -p tap/Casks
          cp "$CASK.rb" "tap/Casks/$CASK.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/$CASK.rb"
          if git diff --cached --quiet; then
            echo "Cask unchanged, skipping commit"
            exit 0
          fi
          git commit -m "Update $CASK to ${VERSION}"
          # The token reaches git only through the environment, for this
          # push: not in argv, not in tap/.git/config.
          auth=$(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            sh -c 'for i in 1 2 3; do git push origin HEAD && exit 0; git pull --rebase || exit 1; sleep 5; done; exit 1'
      - name: Remove the tap clone
        if: always()
        shell: bash
        run: rm -rf tap dmg "$CASK.rb"
