name: Publish crates

# The recovery path for crates.io (kb/docs/releasing.md, "Release
# checklist"): when release.yml's crates-io job failed after the GitHub
# release itself went out, fix the cause on main and run this by hand.
# Publishing is idempotent: crates already on crates.io are skipped.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag, branch or SHA) to publish from"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  publish:
    uses: ractive/release-workflows/.github/workflows/publish-crates.yml@v0.2.1
    secrets: inherit
    with:
      # The same list and order as release.yml's publish-crates.
      publish-crates: saturnus,saturnus-objects,saturnus-host,saturnus-drive,saturnus-cli
      ref: ${{ inputs.ref }}
