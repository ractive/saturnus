name: Web page

# Builds the web page and publishes it to the owner's site ractive.ch (the
# `ractive` job: FTPS into httpdocs/saturnus/, the FTP_PASSWORD repository
# secret; the name only ever appears here). GitHub Pages is not used
# (disabled on 2026-10-08). Manual dispatch; run it after a merge to main
# that changes web/ or the bindings (kb/docs/releasing.md).

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Web package (wasm-pack)
        run: web/build.sh -- --locked
      # The page and what it loads; not the docs or wasm-pack's metadata.
      - name: Site
        run: web/site.sh site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site
          # .htaccess is a hidden file; the action drops those by default.
          include-hidden-files: true
          retention-days: 1

  ractive:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
      - name: The site has its .htaccess
        run: test -f site/.htaccess && ls -la site
      # Explicit TLS: the password and the files never travel in clear.
      # The action only adds and overwrites; a file renamed or removed in
      # web/ stays on the server until cleaned by hand (kb/docs/releasing.md).
      - uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ractive.ch
          username: ractive
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: site/
          server-dir: httpdocs/saturnus/
