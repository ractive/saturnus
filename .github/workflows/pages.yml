name: Web page

# Builds the site of /saturnus/ (the landing page, the emulator under
# emulator/, saturnus tx under transfer/, the kill switch sw.js;
# web/site.sh) and publishes it to the
# owner's site ractive.ch (the `ractive` job: FTPS into httpdocs/saturnus/,
# the FTP_PASSWORD repository secret; the name only ever appears here). GitHub Pages is not used
# (disabled on 2026-10-08). Manual dispatch; run it after a merge to main
# that changes web/ or the bindings (kb/docs/releasing.md).

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Web package (wasm-pack)
        run: web/build.sh -- --locked
      - name: Transfer page's package (wasm-pack)
        run: web/tx-build.sh -- --locked
      # The landing page, the emulator, the transfer page and what they
      # load; not the docs or wasm-pack's metadata.
      - name: Site
        run: web/site.sh site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site
          # .htaccess is a hidden file; the action drops those by default.
          include-hidden-files: true
          retention-days: 1

  # Only a run dispatched on main publishes; another branch builds the
  # site (the artifact) and stops there.
  ractive:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
      - name: The site has its .htaccess
        run: test -f site/.htaccess && ls -la site
      # Explicit TLS: the password and the files never travel in clear.
      # The action keeps .ftp-deploy-sync-state.json in server-dir and
      # syncs against it: a file it deployed earlier that is no longer in
      # site/ is deleted on the next run ("Uploading", "Deleting",
      # "Replacing" in its log); its `exclude` patterns are left out of
      # publishing and deleting alike. A file that never went through the
      # action is unknown to the sync state and stays (kb/docs/releasing.md).
      # The upload is not atomic and goes by path, so a subsite's sw.js
      # lands before its tx/ and pkg/ files: its service worker checks each
      # file's hash and refuses a mixed build (kb/decision-log.md,
      # 2026-10-11).
      - uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ractive.ch
          username: ractive
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: site/
          server-dir: httpdocs/saturnus/
