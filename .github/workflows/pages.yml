name: Web page

# Publishes the page twice from one build: GitHub Pages, and ractive.ch
# (FTP into httpdocs/saturnus/, the owner's site). The FTP password is the
# FTP_PASSWORD secret; names only ever appear here.

# Publishes web/ with its WebAssembly package to GitHub Pages. Manual only:
# Pages must first be enabled in the repository settings with "GitHub
# Actions" as the source (kb/docs/releasing.md, "Web page"); until then the
# deploy job fails and nothing is published.

on:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Web package (wasm-pack)
        run: web/build.sh -- --locked
      # The page and what it loads; not the docs or wasm-pack's metadata.
      - name: Site
        run: web/site.sh site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  ractive:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: site
      - uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ractive.ch
          username: ractive
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: site/
          server-dir: httpdocs/saturnus/
