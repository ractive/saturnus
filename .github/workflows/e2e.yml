name: satx e2e

# satx against the saturnng oracle and satx lx against the BSD Filer
# oracle, so not on every PR push (kb/docs/ci.md, "What runs when").
# Two sets: the quick one (satx-core's e2e suite per model and lx-e2e,
# about 5 minutes) and the full one, which adds the CLI script
# scripts/satx-e2e-cli.sh per model (6-7.5 minutes more each, 14-18 in
# all). The quick set runs
# - on a push to main whose changes reach what the job builds: satx and
#   its protocol crates, the saturnus crates of its `saturnus` feature,
#   the oracle image, the CLI script, the Cargo files, this workflow
#   (`cargo tree -p satx-core -p satx --all-features` lists the crates).
#   The web app's Files (crates/saturnus-tx*, web/tx/) is not among them:
#   nothing here builds it; its emulated-calculator e2e is local
#   (`just tx-e2e`);
# - on a pull request carrying the label `e2e` (adding it starts a run;
#   later pushes to the PR run it again while the label is on);
# - by hand (`gh workflow run e2e.yml --ref <branch>`).
# The full set runs
# - nightly at 03:17 UTC on main (schedule), only in ractive/saturnus and
#   only when main moved since the last green nightly (the `nightly` job);
# - by hand with `-f full=true`; before a release on the release commit,
#   unless the last nightly on it is green (kb/docs/releasing.md).
# A separate workflow, not a job in ci.yml: a `labeled` trigger there
# would rerun all of CI for every label (dependabot adds two to each PR).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
      - 'iter-*/**'
  push:
    branches:
      - main
    paths:
      - 'crates/satx-core/**'
      - 'crates/satx-cli/**'
      - 'crates/kermit-proto/**'
      - 'crates/xmodem-proto/**'
      - 'crates/filer-proto/**'
      - 'crates/saturnus-core/**'
      - 'crates/saturnus-objects/**'
      - 'crates/saturnus-host/**'
      - 'crates/saturnus-drive/**'
      - 'tools/saturnng-oracle/**'
      - 'tools/filer-oracle/**'
      - 'scripts/satx-e2e-cli.sh'
      - 'scripts/satx-lx-e2e.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: "The full set: the CLI script per model too (6-7.5 minutes more each)"
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a PR supersedes the run still going for the previous one.
# Each push to main has a group of its own (never cancelled, never
# replaced while pending). Adding a label other than `e2e` starts a run
# whose job is skipped; it gets a group of its own so that it does not
# cancel an e2e run in progress. A nightly and a run by hand go by their
# ref (one running, one pending per branch).
concurrency:
  group: e2e-${{ (github.event_name == 'push' && github.sha) || (github.event.action == 'labeled' && github.event.label.name != 'e2e' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A scheduled run (GitHub runs those on main only) goes on only in the
  # repository itself, not a fork, and only when main is not still at
  # the commit of the last green nightly: the same commit would run the
  # same 20 minutes again. An error asking the API runs it anyway.
  nightly:
    if: github.event_name == 'schedule' && github.repository == 'ractive/saturnus'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.last.outputs.run }}
    steps:
      - id: last
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          last=$(gh run list --workflow e2e.yml --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""') || last=""
          if [ "$last" = "$SHA" ]; then
            echo "main is still at $SHA, the last green nightly's commit: nothing to run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $SHA, the last green nightly ran ${last:-nothing}"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # satx against the saturnng oracle (tools/saturnng-oracle/), the
  # black-box reference kb/docs/clean-room-rule.md allows: the image
  # downloads the ROMs from hpcalc.org at build time and is never cached,
  # pushed or shipped. Ports 4848 and 4850 belong to these containers.
  # One job per model, in parallel, each with its own oracle: the time is
  # the tests' (about 1.5-2 minutes of core suite per model, and in the
  # full set 6-7.5 of CLI script), not the build's.
  satx-e2e:
    # On a pull request only with the label, and of the `labeled` events
    # only the one for `e2e`; a run for another label, or for a push to an
    # unlabelled PR, shows the job as skipped (as `satx-e2e`, a name
    # distinct from the matrix jobs', so it hides no earlier result). A
    # scheduled run only when `nightly` says so; `!cancelled()` lets the
    # job run when `nightly` was skipped (every other event).
    needs: nightly
    if: >-
      !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'schedule' && needs.nightly.outputs.run == 'true')
          || (github.event_name == 'pull_request'
              && contains(github.event.pull_request.labels.*.name, 'e2e')
              && (github.event.action != 'labeled' || github.event.label.name == 'e2e')))
    strategy:
      fail-fast: false
      matrix:
        # The ports of the local convention (CLAUDE.md, "satx").
        include:
          - model: 48sx
            port: 4848
          - model: 49g
            port: 4850
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The full set (the CLI script too): nightly, or by hand with
      # `-f full=true`.
      FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves (PRs restore main's caches): PR caches filled
          # the 10 GB Actions cache and evicted main's (kb/docs/ci.md).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the oracle image
        run: docker build -t hp49g-emu tools/saturnng-oracle
      - name: Start the calculator
        env:
          MODEL: ${{ matrix.model }}
          PORT: ${{ matrix.port }}
        run: |
          docker run -d -p "$PORT:4848" -e MODEL="$MODEL" --name calc hp49g-emu
          # Bridged only once the Kermit server answered (the entrypoint
          # restarts a start that does not answer); fails at once with the
          # container's log when it gives up.
          tools/saturnng-oracle/wait-ready.sh calc
      - name: satx-core end-to-end tests
        env:
          SATX_E2E_ADDR: tcp://localhost:${{ matrix.port }}
          SATX_E2E_CONTAINER: calc
        run: cargo test --locked -p satx-core --test e2e -- --nocapture
      # After the satx-core suite the emulated 49G used to be wedged (no
      # answer even after SERVER was retyped; kb/backlog/satx-flaky-xmodem-e2e.md).
      # A Kermit probe measures that, in every run: a calculator that does
      # not answer gets an "Oracle wedged" warning with the probe output
      # and log. When the CLI script follows (the full set), the 49G is
      # then restarted either way, so its CLI script starts from a fresh
      # calculator as before (in the branch runs without that restart, 1 of
      # 9 failed in the script's aborted-command resync,
      # kb/backlog/satx-ci-emulator-flakes.md); the 48SX only when silent.
      - name: Check the calculator after the core suite
        env:
          MODEL: ${{ matrix.model }}
          PORT: ${{ matrix.port }}
        run: |
          if out=$(timeout 60 python3 tools/saturnng-oracle/kermit-probe.py localhost "$PORT" init 2>&1); then
            echo "the $MODEL answers after the satx-core suite"
            [ "$FULL" = true ] && [ "$MODEL" = 49g ] || exit 0
          else
            echo "::warning title=Oracle wedged::the $MODEL did not answer after the satx-core suite (kb/backlog/satx-flaky-xmodem-e2e.md)"
            echo "$out"
            docker exec calc calc-screen || true
            docker logs calc 2>&1 | grep -v 'Write into' | tail -n 50
            [ "$FULL" = true ] || exit 0
          fi
          docker rm -f calc
          docker run -d -p "$PORT:4848" -e MODEL="$MODEL" --name calc hp49g-emu
          tools/saturnng-oracle/wait-ready.sh calc
      - name: CLI end-to-end script
        if: env.FULL == 'true'
        env:
          SATX_E2E_ADDR: tcp://localhost:${{ matrix.port }}
          SATX_E2E_MODEL: ${{ matrix.model }}
          # The 48SX has no XModem: the script checks that it is refused.
          # On the 49G the XModem steps type EVAL and SERVER via
          # docker exec calc calc-keys.
          SATX_E2E_CONTAINER: calc
        run: scripts/satx-e2e-cli.sh
      - name: Screen and log on failure
        if: failure()
        run: |
          docker exec calc calc-screen || true
          docker exec calc cat /tmp/saturn.log || true
          docker logs calc

  # satx lx against BSD Filer v0.3 (tools/filer-oracle/), a Unix emulation
  # of the HP 100LX/200LX Filer server, as a black box: the image builds it
  # from the author's archive (checksum checked) and is never cached,
  # pushed or shipped. Port 4853. A minute or two of tests, its CLI script
  # (scripts/satx-lx-e2e.sh) included in every run; the same gating as
  # satx-e2e.
  lx-e2e:
    needs: nightly
    if: >-
      !cancelled()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'schedule' && needs.nightly.outputs.run == 'true')
          || (github.event_name == 'pull_request'
              && contains(github.event.pull_request.labels.*.name, 'e2e')
              && (github.event.action != 'labeled' || github.event.label.name == 'e2e')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the Filer oracle image
        run: docker build -t filer-oracle tools/filer-oracle
      - name: Start BSD Filer
        run: |
          docker run -d -p 4853:4853 --name lx filer-oracle
          tools/filer-oracle/wait-ready.sh lx
      - name: satx-core lx tests (in process and against the oracle)
        env:
          FILER_E2E_ADDR: tcp://localhost:4853
        run: |
          cargo test --locked -p satx-core --test e2e lx:: -- --nocapture
      - name: CLI end-to-end script
        env:
          FILER_E2E_ADDR: tcp://localhost:4853
        run: scripts/satx-lx-e2e.sh
      - name: Log on failure
        if: failure()
        run: |
          docker exec lx cat /tmp/bsdfiler.log || true
          docker logs lx
